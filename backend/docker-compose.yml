# Local development only (run from backend/: make dev-up).
# Image tag verified on Docker Hub and tested locally 2026-10-11 (Rancher Desktop, Docker 29.1.3).
services:
  arcadedb:
    image: arcadedata/arcadedb:26.10.1
    container_name: topology-arcadedb
    restart: unless-stopped
    environment:
      ARCADEDB_SETTINGS: "-Darcadedb.server.rootPasswordPath=/run/secrets/arcadedb_root_password -Darcadedb.maxPageRAM=256"
      # Explicit memory budget. The image default (-XX:MaxRAMPercentage=75, uncapped page cache) let the
      # JVM grow until the kernel OOM killer stopped it inside Rancher Desktop's 2 GB VM.
      ARCADEDB_OPTS_MEMORY: "-Xms128M -Xmx384M"
      # Serial GC: smallest footprint for local development. The image default (generational ZGC)
      # maps the heap through shared memory, which exhausted a 2 GB Rancher Desktop VM.
      ARCADEDB_OPTS_GC: "-XX:+UseSerialGC"
    # Over-budget kills only this container (visible as OOMKilled) instead of a VM-wide OOM kill.
    mem_limit: 768m
    ports:
      # Localhost only (SECURITY.md); never publish the database on all interfaces.
      - "127.0.0.1:2480:2480"
    secrets:
      - arcadedb_root_password
    volumes:
      - arcadedb_data:/home/arcadedb/databases
    # The image (Alpine) has wget but no curl or bash. /api/v1/ready needs no credentials and returns 204.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:2480/api/v1/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

secrets:
  arcadedb_root_password:
    file: ./secrets/arcadedb_root_password.txt

volumes:
  arcadedb_data:
