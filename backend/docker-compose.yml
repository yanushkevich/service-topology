# Local development only (run from backend/: make dev-up).
# Image tag verified on Docker Hub and tested locally 2026-10-11 (Rancher Desktop, Docker 29.1.3).
#
# MongoDB runs as a single-node replica set: multi-document transactions (topology import, simulation
# runs, retention) need one. With access control on, a replica set also needs a key file for internal
# authentication; a single node never uses it, so a fresh one is generated at every start.
services:
  mongodb:
    image: mongo:8.0.30
    container_name: topology-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD_FILE: /run/secrets/mongodb_root_password
    entrypoint:
      - /bin/sh
      - -c
      - >-
        openssl rand -base64 756 > /tmp/mongo-keyfile &&
        chmod 400 /tmp/mongo-keyfile && chown mongodb:mongodb /tmp/mongo-keyfile &&
        exec docker-entrypoint.sh mongod --replSet rs0 --keyFile /tmp/mongo-keyfile --bind_ip_all
        --wiredTigerCacheSizeGB 0.25
    # Explicit memory budget for a 2 GB Rancher Desktop VM shared with k3s. WiredTiger's cache would
    # default to half of (VM RAM - 1 GB); 0.25 GB is MongoDB 8's minimum and plenty for 1,000
    # entities (about 310 MB resident under the integration tests). Over-budget kills only this
    # container (visible as OOMKilled) instead of a VM-wide OOM kill.
    mem_limit: 640m
    ports:
      # Localhost only (SECURITY.md); never publish the database on all interfaces.
      - "127.0.0.1:27017:27017"
    secrets:
      - mongodb_root_password
    volumes:
      - mongodb_data:/data/db
    # Initiates the replica set on first start (idempotent), then reports healthy once this node is
    # the writable primary. The password is read inside mongosh, never put on a command line.
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --norc
        - --eval
        - >-
          db.getSiblingDB('admin').auth('root', require('fs').readFileSync('/run/secrets/mongodb_root_password', 'utf8').trim());
          try { rs.status() } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: '127.0.0.1:27017' }] }) }
          if (!db.hello().isWritablePrimary) quit(1)
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 20s

secrets:
  mongodb_root_password:
    file: ./secrets/mongodb_root_password.txt

volumes:
  mongodb_data:
