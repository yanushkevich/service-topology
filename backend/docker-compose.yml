# Local development only (run from backend/: make dev-up).
# Image tag verified on Docker Hub and tested locally 2026-10-11 (Rancher Desktop, Docker 29.1.3).
#
# MongoDB runs as a single-node replica set: multi-document transactions (topology import, simulation
# runs, retention) need one. With access control on, a replica set also needs a key file for internal
# authentication; a single node never uses it, so a fresh one is generated at every start.
services:
  mongodb:
    image: mongo:8.0.30
    container_name: topology-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD_FILE: /run/secrets/mongodb_root_password
    entrypoint:
      - /bin/sh
      - -c
      - >-
        openssl rand -base64 756 > /tmp/mongo-keyfile &&
        chmod 400 /tmp/mongo-keyfile && chown mongodb:mongodb /tmp/mongo-keyfile &&
        exec docker-entrypoint.sh mongod --replSet rs0 --keyFile /tmp/mongo-keyfile --bind_ip_all
        --wiredTigerCacheSizeGB 0.25
    # Explicit memory budget for a 2 GB Rancher Desktop VM shared with k3s. WiredTiger's cache would
    # default to half of (VM RAM - 1 GB); 0.25 GB is MongoDB 8's minimum and plenty for 1,000
    # entities (about 310 MB resident under the integration tests). Over-budget kills only this
    # container (visible as OOMKilled) instead of a VM-wide OOM kill.
    mem_limit: 640m
    ports:
      # Localhost only (SECURITY.md); never publish the database on all interfaces.
      - "127.0.0.1:27017:27017"
      # mongo-express (below) shares this container's network, so its port is published here.
      - "127.0.0.1:8081:8081"
    secrets:
      - mongodb_root_password
    volumes:
      - mongodb_data:/data/db
    # Initiates the replica set on first start (idempotent), then reports healthy once this node is
    # the writable primary. The password is read inside mongosh, never put on a command line.
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --norc
        - --eval
        - >-
          db.getSiblingDB('admin').auth('root', require('fs').readFileSync('/run/secrets/mongodb_root_password', 'utf8').trim());
          try { rs.status() } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: '127.0.0.1:27017' }] }) }
          if (!db.hello().isWritablePrimary) quit(1)
      # mongosh is a Node.js process (~100 MB): check often only while starting, then every 30 s, so
      # the check itself does not add memory pressure on a small VM.
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 120s
      start_interval: 5s

  # Web UI for browsing the local database: http://127.0.0.1:8081 (make db-ui). Opt-in profile so it
  # costs no VM memory unless started. It shares the database container's network namespace: the
  # replica set advertises its member as 127.0.0.1:27017, which only resolves to the database from
  # there. Login (HTTP basic auth) and the database connection both use root and the password file.
  # mongo-express 1.0.2 is the latest release (2024) and sees little maintenance: local use only.
  mongo-express:
    image: mongo-express:1.0.2-20-alpine3.19
    container_name: topology-mongo-express
    profiles: ["ui"]
    restart: unless-stopped
    network_mode: "service:mongodb"
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      VCAP_APP_HOST: 0.0.0.0
      # The image defaults this to mongodb://mongo:27017, and its entrypoint waits for that host before
      # starting; point it at the shared namespace. The connection itself is built from the
      # SERVER/PORT/ADMIN* settings below (no credentials here).
      ME_CONFIG_MONGODB_URL: mongodb://127.0.0.1:27017
      ME_CONFIG_MONGODB_SERVER: 127.0.0.1
      ME_CONFIG_MONGODB_PORT: "27017"
      ME_CONFIG_MONGODB_AUTH_DATABASE: admin
      ME_CONFIG_MONGODB_ADMINUSERNAME: root
      ME_CONFIG_MONGODB_ADMINPASSWORD_FILE: /run/secrets/mongodb_root_password
      ME_CONFIG_MONGODB_ENABLE_ADMIN: "true"
      ME_CONFIG_BASICAUTH: "true"
      ME_CONFIG_BASICAUTH_USERNAME: root
      ME_CONFIG_BASICAUTH_PASSWORD_FILE: /run/secrets/mongodb_root_password
    mem_limit: 160m
    secrets:
      - mongodb_root_password

secrets:
  mongodb_root_password:
    file: ./secrets/mongodb_root_password.txt

volumes:
  mongodb_data:
