<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Orrery — visual direction</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#05070d}
a{color:#8fd8ff}a:hover{color:#c5ecff}
.sh{display:inline-block;width:1em;height:1em;position:relative;flex:none}
.sv{border-radius:50%;background:radial-gradient(circle at 34% 30%,#fff 0,#b9d0ff 16%,#5b78e6 55%,#1b2558 100%);box-shadow:0 0 .45em rgba(125,160,255,.5)}
.gw{clip-path:polygon(25% 4%,75% 4%,100% 50%,75% 96%,25% 96%,0 50%);background:linear-gradient(140deg,#e9fcff,#5fe1ff 40%,#1583a8)}
.db{width:.86em;border-radius:50%/20%;background:linear-gradient(180deg,#e4dcff 0 14%,#a78bfa 14% 36%,#4b3a99 36% 42%,#a78bfa 42% 64%,#4b3a99 64% 70%,#8f74ea 70%);box-shadow:0 0 .4em rgba(167,139,250,.45)}
.ca{transform:rotate(45deg) scale(.74);border-radius:.14em;background:linear-gradient(135deg,#f0eaff,#a78bfa 45%,#3d2f85);box-shadow:0 0 .4em rgba(167,139,250,.45)}
.tp{width:1.4em;height:.72em;border-radius:.36em;background:repeating-linear-gradient(90deg,#aab3ff 0 .2em,#2a2f6e .2em .28em);box-shadow:0 0 .4em rgba(125,139,255,.5)}
.qu{width:1.4em;height:.72em;border-radius:.36em;border:.09em solid #aab3ff;background:linear-gradient(90deg,transparent 0 50%,#7d8bff 50% 64%,transparent 64% 72%,#7d8bff 72% 86%,transparent 86%)}
.ex{border:.09em dashed #9aa6c4;border-radius:.16em;background:rgba(154,166,196,.14);transform:scale(.84)}
.cl{border-radius:50%;border:.1em solid #8fa2ff;background:radial-gradient(circle,#dfe6ff 0 18%,transparent 22%)}
.ns{border-radius:.24em;border:.1em dashed #8fa2ff;background:radial-gradient(circle,#c9d3ff 0 14%,transparent 18%)}
.in{border-radius:50%;background:radial-gradient(circle at 35% 30%,#eaf2ff,#7f9df0 60%,#2a3a80);transform:scale(.8)}
.st{flex:none;display:inline-block;width:18px;height:18px;font-size:11px;font-weight:700;line-height:18px;text-align:center;color:#06101a}
.st.ok{border-radius:50%;background:#3dd6b0}
.st.warn{clip-path:polygon(50% 0,100% 100%,0 100%);background:#f5b454;line-height:22px}
.st.crit{clip-path:polygon(30% 0,70% 0,100% 30%,100% 70%,70% 100%,30% 100%,0 70%,0 30%);background:#ff7b7b}
</style>
</helmet>
<div style="width: 1440px; height: 900px; box-sizing: border-box; padding: 48px 56px; background: #05070d; color: #e7ecf8; font-family: 'Geist', system-ui, sans-serif; font-size: 13px; line-height: 1.45; display: flex; flex-direction: column; gap: 28px">

<div style="display: flex; align-items: flex-end; justify-content: space-between; gap: 40px">
<div>
<div style="font-family: 'Geist Mono', monospace; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: #7f8cab">Visual direction</div>
<h1 style="margin: 6px 0 0; font-size: 38px; font-weight: 600; letter-spacing: -.02em">A precision workbench attached to a living galaxy</h1>
</div>
<div style="max-width: 420px; color: #a7b1ca">One identity per resource type, carried unchanged from the 2D graph to the 3D scene. Glow is rationed: selection, active paths and status only.</div>
</div>


</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
