<title>Payment Service Transit Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: line index | perspective transit map over a stop-by-stop strip | line card. Dark-only by choice: a control-room board. */
:root{
  color-scheme:dark;
  --ground:#05060b; --panel:#0a0d17; --raise:#121729; --line:#1b2238; --line2:#2a3352;
  --ink:#eaeef8; --ink2:#a9b2c9; --ink3:#78839f;

  --mono:'Geist Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
html,body{height:100%}
body{background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:13px;line-height:1.45}
*{box-sizing:border-box}
button,input{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;text-align:left}
:focus-visible{outline:2px solid var(--cy);outline-offset:2px}
.mono{font-family:var(--mono)}
.k{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3)}
.app{min-height:100%;display:grid;grid-template-rows:auto 1fr;padding-inline:16px;padding-block:0 16px;gap:14px;background:radial-gradient(ellipse 60% 50% at 55% 40%,rgba(40,60,120,.16),transparent 70%),var(--ground)}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:14px;border-bottom:1px solid var(--line)}
header .crumb{color:var(--ink3);font-size:12.5px}
header h1{font-size:15px;font-weight:600;margin:0;letter-spacing:-.005em}
header .sp{flex:1}
.seg{display:inline-flex;gap:2px;padding:3px;border-radius:9px;border:1px solid var(--line)}
.seg button{height:26px;padding:0 12px;border-radius:6px;font-size:12px;color:var(--ink3)}
.seg button[aria-pressed="true"]{background:var(--raise);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line2)}
.seg button:disabled{opacity:.4;cursor:default}
.main{display:grid;grid-template-columns:260px minmax(0,1fr) 330px;grid-template-areas:'idx map card' 'idx strip strip';gap:14px;min-height:0}
.index{grid-area:idx}.mapwrap{grid-area:map}.strip{grid-area:strip}.card{grid-area:card}
.panel{background:rgba(10,13,23,.88);border:1px solid var(--line);border-radius:14px;min-width:0}
/* index */
.index{padding:14px;display:flex;flex-direction:column;gap:12px;align-self:start}
.search{display:flex;align-items:center;gap:8px;height:36px;border-radius:9px;border:1px solid var(--line2);padding:0 10px;background:var(--ground)}
.search input{flex:1;min-width:0;background:none;border:0;outline:none;font-size:12.5px}
.search input::placeholder{color:var(--ink3)}
.grp{display:flex;flex-direction:column;gap:2px}
.grp .k{padding:6px 8px 4px}
.row{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:8px;width:100%;font-size:12.5px;color:var(--ink2)}
.row:hover{background:var(--raise);color:var(--ink)}
.row[aria-current="true"]{background:rgba(255,255,255,.06);box-shadow:inset 0 0 0 1px rgba(255,255,255,.14);color:var(--ink)}
.bdg{width:28px;height:20px;border-radius:5px;display:grid;place-items:center;font-family:var(--mono);font-size:10.5px;font-weight:500;color:#05060b;flex:none}
.row .n{flex:1;min-width:0;font-family:var(--mono);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .m{font-size:10.5px;color:var(--ink3);white-space:nowrap;font-variant-numeric:tabular-nums}
.warnm{color:var(--warn)}
.empty{font-size:12px;color:var(--ink3);padding:8px}
/* center */
.center{display:flex;flex-direction:column;gap:14px;min-width:0}
.mapwrap{position:relative;padding:6px 6px 34px;overflow:hidden;display:flex;align-items:center}
.mapwrap svg{display:block;width:100%;height:auto}
.legend{position:absolute;left:18px;bottom:14px;display:flex;gap:18px;flex-wrap:wrap;font-size:11px;color:var(--ink3);pointer-events:none;white-space:nowrap}
.legend span{display:inline-flex;align-items:center;gap:6px}
.strip{padding:12px 16px 10px}
.strip .sx{overflow-x:auto}
.strip svg{display:block}
.striphead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
/* card */
.card{padding:16px;display:flex;flex-direction:column;gap:14px;align-self:stretch;max-height:600px;overflow:auto}
.kv{display:flex;justify-content:space-between;gap:12px;font-size:12px;padding:5px 0;border-top:1px solid var(--line)}
.kv span:first-child{color:var(--ink3)}
.kv span:last-child{font-family:var(--mono);text-align:right;font-variant-numeric:tabular-nums}
.pc{display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:11px;border:1px solid var(--line2);font-size:11px;color:var(--ink2);margin:0 4px 6px 0}
.fd{display:flex;gap:9px;font-size:12px;line-height:1.45}
.tri{width:12px;height:12px;flex:none;margin-top:2px;clip-path:polygon(50% 0,100% 100%,0 100%);background:var(--warn)}
.dot{width:10px;height:10px;flex:none;margin-top:3px;border-radius:50%}
.src{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;font-size:12px}
.src b{font-weight:500;color:var(--ink)}
.src .t{color:var(--ink3);font-size:11.5px}
.tag{display:inline-flex;align-items:center;height:18px;padding:0 6px;border-radius:4px;font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.tag.decl{background:rgba(143,155,255,.16);color:#b8c0ff}.tag.obs{background:rgba(61,214,176,.14);color:#7fe6c9}.tag.inf{background:rgba(245,180,84,.14);color:#f7c987}
.trl{display:flex;flex-direction:column;gap:2px}
.tr{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:7px 8px;border-radius:8px;width:100%;font-size:12px}
.tr:hover{background:var(--raise)}
.tr[aria-current="true"]{background:rgba(95,225,255,.08);box-shadow:inset 0 0 0 1px rgba(95,225,255,.35)}
.tr .d{font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--ink2)}
.pill{height:18px;padding:0 7px;border-radius:9px;font-family:var(--mono);font-size:10px;display:inline-flex;align-items:center}
.pill.ok{background:rgba(61,214,176,.15);color:#7fe6c9}.pill.warn{background:rgba(245,180,84,.16);color:#f7c987}.pill.fail{background:rgba(255,123,123,.16);color:#ffa3a3}
.steps{display:flex;flex-direction:column;max-height:300px;overflow:auto;border-top:1px solid var(--line)}
.st{display:grid;grid-template-columns:58px 10px 1fr;gap:8px;padding:5px 0;font-size:12px;color:var(--ink3)}
.st.done{color:var(--ink2)}.st.now{color:var(--ink)}
.st .tm{font-family:var(--mono);font-size:10.5px;text-align:right;font-variant-numeric:tabular-nums;padding-top:1px}
.st .mk{width:8px;height:8px;border-radius:50%;margin-top:5px;background:var(--line2)}
.st.done .mk{background:var(--ink3)}.st.now .mk{background:var(--cy);box-shadow:0 0 8px var(--cy)}
.st .mk.warn{background:var(--warn)}.st .mk.fail{background:var(--fail)}
.ctl{display:flex;align-items:center;gap:8px}
.btn{height:30px;padding:0 12px;border-radius:8px;border:1px solid var(--line2);font-size:12px;color:var(--ink);display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--raise)}
.btn.pri{background:var(--cy);border-color:var(--cy);color:#04121a;font-weight:600}
.bar{flex:1;height:4px;border-radius:2px;background:var(--line2);position:relative;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--cy)}
.big{font-size:16px;font-weight:600;letter-spacing:-.005em}
@media (max-width:1180px){.main{grid-template-columns:240px minmax(0,1fr);grid-template-areas:'idx map' 'idx strip' 'card card'}.card{max-height:none}}
@media (max-width:760px){.main{grid-template-columns:minmax(0,1fr);grid-template-areas:'idx' 'map' 'strip' 'card'}.legend{display:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

</div>

function drawCard(){
  const box=$('card');const l=S.sel?LM[S.sel]:null;
  if(!l){box.innerHTML=`<div><div class="k">Where the map comes from</div><div class="src" style="margin-top:10px"><span class="tag decl">declared</span><span><b>Lines</b><br><span class="t">Entry points from payments.proto, openapi.yaml, asyncapi.yaml and the scheduler config</span></span><span class="tag obs">observed</span><span><b>Routes and timings</b><br><span class="t">Built from 639k traces over the last 7 days</span></span><span class="tag decl">declared</span><span><b>Policy stops</b><br><span class="t">Resilience config and mesh rules; fire rates from spans</span></span><span class="tag inf">inferred</span><span><b>Query, PaymentSaga, OutboxRelay route</b><br><span class="t">From a code scan, because they emit no spans</span></span></div></div><div><div class="k">How to read it</div><div style="color:var(--ink2);font-size:12.5px;margin-top:6px">Each endpoint, consumed event or job is one line. Lines that run side by side share code. Diamonds are the policies a call passes before it reaches a dependency.</div></div>`;return;}
  const head=`<div style="display:flex;align-items:center;gap:10px"><span class="bdg" style="background:${l.c};width:34px;height:26px;font-size:12px">${l.id}</span><div style="min-width:0"><div class="big">${esc(l.name)}</div><div class="k" style="margin-top:2px">${l.g}</div></div></div><div class="mono" style="font-size:11.5px;color:var(--ink2);overflow-wrap:anywhere">${esc(l.sig)}</div>`;
  if(S.mode==='typical'){
    box.innerHTML=head+`<div><div class="kv"><span>Caller</span><span>${esc(l.from)}</span></div><div class="kv"><span>Deadline</span><span>${l.dl?fmt(l.dl):'—'}</span></div><div class="kv"><span>p50 / p95</span><span>${l.p50} / ${l.p95}</span></div><div class="kv"><span>Errors</span><span>${l.err}</span></div><div class="kv"><span>Calls per day</span><span>${l.calls}</span></div></div>
    <div><div class="k" style="margin-bottom:8px">Where this line comes from</div><div class="src"><span class="tag decl">declared</span><span class="t">Entry point in ${esc(l.file)}</span>${l.unobserved?'<span class="tag inf">inferred</span><span class="t">Route from a code scan; no traces carry this work</span>':`<span class="tag obs">observed</span><span class="t">Route in ${l.traces} traces, last 7 days</span>`}<span class="tag decl">declared</span><span class="t">Policies from resilience config</span></div></div>
    <div><div class="k" style="margin-bottom:8px">Patterns on this line</div><div>${l.pats.map(p=>`<span class="pc">${esc(p)}</span>`).join('')}</div></div>
    <div><div class="k" style="margin-bottom:8px">Findings</div><div style="display:flex;flex-direction:column;gap:8px">${l.find.length?l.find.map(f=>`<div class="fd"><span class="${f[0]==='w'?'tri':'dot'}" style="${f[0]==='o'?'background:var(--ok)':f[0]==='i'?'background:var(--warn);opacity:.6':''}"></span>${esc(f[1])}</div>`).join(''):'<div class="fd" style="color:var(--ink3)">Nothing to review on this line.</div>'}</div></div>
    ${l.tr.length?`<button class="btn pri" id="toTrace">Replay a real request</button>`:''}`;
    const b=$('toTrace');if(b)b.addEventListener('click',()=>setMode('trace'));
  } else {
    if(!l.tr.length){box.innerHTML=head+`<div class="fd"><span class="tri"></span>No traces exist for this line. The relay does not carry trace context, so its runs cannot be replayed. Propagating context from the outbox row would make it traceable.</div>`;return;}
    const tr=l.tr[S.ti];const cur=curStep(tr);const pct=Math.min(100,S.t/tr.total*100);
    box.innerHTML=head+`<div><div class="k" style="margin-bottom:6px">Recent requests</div><div class="trl">${l.tr.map((x,i)=>`<button class="tr" data-i="${i}" aria-current="${i===S.ti}"><span class="pill ${x.st}">${x.st==='ok'?'ok':x.st==='warn'?'slow':'failed'}</span><span style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"><span class="mono">${esc(x.key)}</span> <span style="color:var(--ink3)">· ${x.ago}</span></span><span class="d">${fmt(x.total)}</span></button>`).join('')}</div></div>
    <div><div style="display:flex;justify-content:space-between;align-items:baseline"><span class="mono" style="font-size:12px">${esc(tr.id)}</span><span class="mono" style="font-size:12px;color:${tr.st==='ok'?'var(--ok)':tr.st==='warn'?'var(--warn)':'var(--fail)'}">${fmt(tr.total)}${l.dl?' / '+fmt(l.dl)+' deadline':''}</span></div>
    <div class="ctl" style="margin-top:10px"><button class="btn pri" id="play" aria-label="${S.playing?'Pause':'Play'}">${S.playing?'Pause':S.t>=tr.total?'Replay':'Play'}</button><button class="btn" id="back" aria-label="Previous step">Back</button><button class="btn" id="fwd" aria-label="Next step">Next</button><div class="bar"><i style="width:${pct}%"></i></div></div></div>
    <div class="steps" id="steps">${tr.steps.map(st=>{const cls=st===cur?'now':st.start<=S.t?'done':'';return `<div class="st ${cls}"><span class="tm">${fmt(st.start)}</span><span class="mk ${st.st!=='ok'?st.st:''}"></span><span>${esc(st.label)}</span></div>`;}).join('')}</div>`;
    box.querySelectorAll('.tr').forEach(b=>b.addEventListener('click',()=>{S.ti=+b.getAttribute('data-i');S.t=0;S.playing=true;render();loop();}));
    $('play').addEventListener('click',()=>{if(S.t>=tr.total)S.t=0;S.playing=!S.playing;render();loop();});
    $('back').addEventListener('click',()=>{S.playing=false;const prev=[...tr.steps].reverse().find(x=>x.start<S.t-1);S.t=prev?prev.start:0;render();});
    $('fwd').addEventListener('click',()=>{S.playing=false;const nx=tr.steps.find(x=>x.start>S.t);S.t=nx?nx.start:tr.total;render();});
    const nowEl=box.querySelector('.st.now');if(nowEl){const sc=$('steps');sc.scrollTop=Math.max(0,nowEl.offsetTop-sc.offsetTop-90);}
  }
}
/* ---------------- tie stops to steps ---------------- */
// fix: genTrace stored stop object; resolve index & location
L.forEach(l=>l.tr.forEach(tr=>tr.steps.forEach(st=>{if(st.stop&&typeof st.stop==='object'){const sObj=st.stop;st.stopObj=sObj;}})));
L.forEach(l=>l.tr.forEach(tr=>tr.steps.forEach(st=>{if(st.stopObj){const c=Object.keys(LANE).find(k=>LANE[k].includes(st.stopObj));st.stopIdx=LANE[c].indexOf(st.stopObj);st.at=c;st.stop=c;}else{delete st.stop;}})));
/* ---------------- control ---------------- */
function render(){drawList();drawMap();drawOverlay();drawStrip();drawCard();
  $('mTyp').setAttribute('aria-pressed',S.mode==='typical');$('mTr').setAttribute('aria-pressed',S.mode==='trace');$('mTr').disabled=!S.sel;}
function renderLive(){drawOverlay();drawStrip();drawCard();}
function select(id){S.sel=id;S.t=0;S.playing=S.mode==='trace';if(id&&!LM[id].tr.length)S.playing=false;S.ti=id&&LM[id].tr.length?Math.min(S.ti,LM[id].tr.length-1):0;render();loop();}
function setMode(m){if(m==='trace'&&!S.sel)return;S.mode=m;S.t=0;S.playing=m==='trace';render();loop();}
let raf=0,last=0;
function loop(){if(raf)return;last=0;raf=requestAnimationFrame(tick);}
function tick(now){raf=0;if(!S.playing||S.mode!=='trace'||!S.sel)return;const l=LM[S.sel];const tr=l.tr[S.ti];if(!tr){S.playing=false;return;}
  const dt=last?now-last:16;last=now;const speed=Math.max(1,tr.total/7000);
  const reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  const cur=curStep(tr);const nx=tr.steps.find(x=>x.start>S.t);
  if(reduce){S.t=nx?nx.start:tr.total;} else { const minDwell=650; const target=nx?nx.start:tr.total; const gap=target-S.t; S.t+= Math.max(dt*speed, gap>0?gap*dt/minDwell:0); if(nx&&S.t>nx.start&&nx.start-cur.start<1)S.t=nx.start; }
  if(S.t>=tr.total){S.t=tr.total;S.playing=false;}
  renderLive(); if(S.playing){ if(reduce){setTimeout(()=>{raf=requestAnimationFrame(tick);},700);} else raf=requestAnimationFrame(tick);} }
$('q').addEventListener('input',e=>{S.q=e.target.value;drawList();});
$('mTyp').addEventListener('click',()=>setMode('typical'));
$('mTr').addEventListener('click',()=>setMode('trace'));
render();
})();
</script>

</body></html>
