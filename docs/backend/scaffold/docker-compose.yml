# Local development only. Moves to backend/docker-compose.yml in Milestone B1.
# Image tag verified on Docker Hub 2026-10-11 (published 2026-10-05); not yet tested with this project.
services:
  arcadedb:
    image: arcadedata/arcadedb:26.10.1
    container_name: topology-arcadedb
    restart: unless-stopped
    environment:
      ARCADEDB_SETTINGS: "-Darcadedb.server.rootPasswordPath=/run/secrets/arcadedb_root_password"
    ports:
      # Localhost only (SECURITY.md); never publish the database on all interfaces.
      - "127.0.0.1:2480:2480"
    secrets:
      - arcadedb_root_password
    volumes:
      - arcadedb_data:/home/arcadedb/databases
    # Assumes curl exists in the image; verify in B2 (or switch to ArcadeDB's readiness endpoint).
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -u root:$$(cat /run/secrets/arcadedb_root_password) http://localhost:2480/api/v1/server >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

secrets:
  arcadedb_root_password:
    file: ./secrets/arcadedb_root_password.txt

volumes:
  arcadedb_data:
